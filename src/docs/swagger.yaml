basePath: /
definitions:
  schemas.BookDownloadURL:
    properties:
      downloadUrl:
        type: string
      expiresAt:
        type: string
    type: object
  schemas.BookRead:
    properties:
      book:
        type: string
      fileKey:
        type: string
      id:
        type: string
      serieId:
        type: string
      seriePosition:
        type: integer
    type: object
  schemas.BookUpdate:
    properties:
      book:
        type: string
      fileKey:
        type: string
    type: object
  schemas.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  schemas.SerieCreate:
    properties:
      serie:
        type: string
      universeId:
        type: string
      universePosition:
        type: integer
    required:
    - serie
    type: object
  schemas.SerieRead:
    properties:
      id:
        type: string
      serie:
        type: string
      universeId:
        type: string
      universePosition:
        type: integer
    type: object
  schemas.SerieUpdate:
    properties:
      serie:
        type: string
    type: object
  schemas.UniverseCreate:
    properties:
      universe:
        type: string
    required:
    - universe
    type: object
  schemas.UniverseRead:
    properties:
      id:
        type: string
      universe:
        type: string
    type: object
  schemas.UniverseUpdate:
    properties:
      universe:
        type: string
    type: object
info:
  contact: {}
  description: Manages books, series, and universes for the Lexi platform.
  title: Lexi Book Service API
  version: "1.0"
paths:
  /books:
    get:
      description: Lists books, optionally filtered by serie, universe (resolved via
        the book's serie), or position within the serie
      parameters:
      - description: Filter by serie ID
        in: query
        name: serieId
        type: string
      - description: Filter by universe ID
        in: query
        name: universeId
        type: string
      - description: Filter by exact position in the serie
        in: query
        name: bookPosition
        type: integer
      - description: Filter by position <= this value
        in: query
        name: maxBookPosition
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/schemas.BookRead'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List books
      tags:
      - books
    post:
      consumes:
      - multipart/form-data
      description: 'Accepts multipart/form-data with a "file" part: uploads it to
        object storage, saves the resulting fileKey, and notifies the RAG worker to
        ingest it. Also accepts a plain application/json body shaped like the request
        schema for metadata-only creation (no file, no ingestion notify) — send it
        as JSON instead of multipart in that case.'
      parameters:
      - description: Book name
        in: formData
        name: book
        required: true
        type: string
      - description: Serie ID
        in: formData
        name: serieId
        type: string
      - description: Position within the serie
        in: formData
        name: seriePosition
        type: integer
      - description: The book's file (e.g. epub)
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/schemas.BookRead'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a book
      tags:
      - books
  /books/{id}:
    delete:
      parameters:
      - description: Book ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a book
      tags:
      - books
    get:
      parameters:
      - description: Book ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.BookRead'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a book by ID
      tags:
      - books
    put:
      consumes:
      - application/json
      parameters:
      - description: Book ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/schemas.BookUpdate'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.BookRead'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a book
      tags:
      - books
  /books/{id}/download-url:
    get:
      description: Presigns a short-lived URL (15 min) straight to the bucket. Fails
        with 400 if the book has no file attached yet.
      parameters:
      - description: Book ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.BookDownloadURL'
        "400":
          description: book has no file
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a time-limited download link for a book's file
      tags:
      - books
  /books/name/{name}:
    get:
      parameters:
      - description: Book name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.BookRead'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a book by name
      tags:
      - books
  /series:
    get:
      description: Lists series, optionally filtered by universe or position within
        the universe
      parameters:
      - description: Filter by universe ID
        in: query
        name: universeId
        type: string
      - description: Filter by exact position in the universe
        in: query
        name: universePosition
        type: integer
      - description: Filter by position <= this value
        in: query
        name: maxUniversePosition
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/schemas.SerieRead'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List series
      tags:
      - series
    post:
      consumes:
      - application/json
      parameters:
      - description: Serie to create
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/schemas.SerieCreate'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/schemas.SerieRead'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a serie
      tags:
      - series
  /series/{id}:
    delete:
      parameters:
      - description: Serie ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a serie
      tags:
      - series
    get:
      parameters:
      - description: Serie ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.SerieRead'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a serie by ID
      tags:
      - series
    put:
      consumes:
      - application/json
      parameters:
      - description: Serie ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/schemas.SerieUpdate'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.SerieRead'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a serie
      tags:
      - series
  /universes:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/schemas.UniverseRead'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List universes
      tags:
      - universes
    post:
      consumes:
      - application/json
      parameters:
      - description: Universe to create
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/schemas.UniverseCreate'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/schemas.UniverseRead'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a universe
      tags:
      - universes
  /universes/{id}:
    delete:
      parameters:
      - description: Universe ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a universe
      tags:
      - universes
    get:
      parameters:
      - description: Universe ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.UniverseRead'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a universe by ID
      tags:
      - universes
    put:
      consumes:
      - application/json
      parameters:
      - description: Universe ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/schemas.UniverseUpdate'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.UniverseRead'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/schemas.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a universe
      tags:
      - universes
securityDefinitions:
  BearerAuth:
    description: Raw JWT issued by lexi-users-ms's /login (no "Bearer " prefix).
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
